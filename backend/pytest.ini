[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # FastAPI deprecates @app.on_event in favour of lifespan handlers; api.py still
    # uses on_event, and the message starts with a newline so match it loosely.
    ignore:(?s).*on_event is deprecated:DeprecationWarning
    # Starlette's TestClient touches a deprecated anyio alias on import.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
