<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>OASIS</title>
  </head>
  <body>
    <header>
      <a class="brand" href="https://oasis.fusion-labs.cc" target="_blank" rel="noreferrer"
         title="開啟 oasis.fusion-labs.cc">
        <img class="logo" src="icons/icon48.png" alt="" />
        <h1>OASIS</h1>
      </a>
      <div class="actions">
        <button id="save" type="button">儲存目前分頁</button>
        <button id="hide" type="button" class="icon-btn" title="隱藏清單" aria-label="隱藏清單"></button>
        <button id="settingsBtn" type="button" class="icon-btn" title="Oasis 後端設定" aria-label="Oasis 後端設定">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <p id="status" class="status" hidden></p>

    <!-- Backend connection. The code is only needed when the backend is not on
         this machine (Docker, a NAS, another PC). -->
    <section id="settings" class="settings" hidden>
      <label>後端網址
        <input id="backendUrl" type="url" placeholder="http://localhost:8000" spellcheck="false" />
      </label>
      <label>存取碼（後端在其他裝置或 Docker 時才需要）
        <input id="accessCode" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <div class="settings-actions">
        <button id="testBackend" type="button" class="ghost">測試連線</button>
        <button id="saveSettings" type="button">儲存</button>
      </div>
    </section>

    <!-- Streams the current tab has played, found by background.js. -->
    <section id="mediaView" class="media" hidden>
      <h2>此分頁偵測到的影片</h2>
      <ul id="mediaList" class="list media-list"></ul>
    </section>

    <!-- Normal view: the saved list. In hidden mode the whole thing is withheld;
         the eye icon in the header toggles it back. -->
    <section id="listView">
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>尚未儲存任何網址。</p>
    </section>

    <footer class="site-footer">
      <a href="https://oasis.fusion-labs.cc" target="_blank" rel="noreferrer">
        開啟 Oasis
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17L17 7M9 7h8v8" />
        </svg>
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
